# Thinkpadism — dark, red accents.
# Pairs with the "thinkpad-dark" shell theme.
include common.conf

cursor               #e0303c
cursor_text_color    #141414

selection_background #e0303c
selection_foreground #f5f3f1

background           #141414
foreground           #e6e4e1

# Window borders and tab bar, matching the shell chrome.
active_border_color   #e0303c
inactive_border_color #343434
active_tab_background   #e0303c
active_tab_foreground   #141414
inactive_tab_background #232323
inactive_tab_foreground #9a9691

url_color            #ff5a63

# Normal / bright pairs. Red leads, everything else stays muted so the accent
# keeps its weight.
color0               #232323
color8               #4a4a4a
color1               #c9202b
color9               #ff5a63
color2               #7a9a5e
color10              #9cbd7c
color3               #c9942a
color11              #e8b44c
color4               #5b7a99
color12              #7fa3c4
color5               #97517f
color13              #bb75a3
color6               #4f8f8a
color14              #6fb3ad
color7               #c9c5c0
color15              #f5f3f1
