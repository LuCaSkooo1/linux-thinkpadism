# Thinkpadism — light, red accents.
# Pairs with the "thinkpad-light" shell theme.
include common.conf

cursor               #b3121d
cursor_text_color    #f2f0ed

selection_background #b3121d
selection_foreground #f2f0ed

background           #e8e6e2
foreground           #1c1c1c

active_border_color   #b3121d
inactive_border_color #9a9691
