# Settings shared by every Thinkpadism kitty theme.
# The theme files include this, then set their own colours.

# Block cursor, no blink: the terminal should look like a fixed-function
# device, not a text editor.
shell_integration no-cursor
cursor_shape block
cursor_blink_interval 0

window_padding_width 7
window_padding_height 10

scrollback_lines 5000

font_size 11

# Ctrl+Shift+plus / minus to resize.
map ctrl+shift+plus  change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0

# Near-opaque. Set to a lower value if you turn blur on in hyprland.conf.
background_opacity 0.985

# Square, borderless tabs to match the shell's chiselled look.
tab_bar_style separator
tab_separator " | "

# The bell is a flash, not a noise.
enable_audio_bell no
visual_bell_duration 0.1
