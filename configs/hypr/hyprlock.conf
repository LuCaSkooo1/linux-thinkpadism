# Lock screen, styled to match the shell.

general {
    hide_cursor = true
    grace = 2
    no_fade_in = false
}

background {
    monitor =
    # Blur whatever wallpaper is currently up.
    path = screenshot
    blur_passes = 3
    blur_size = 6
    brightness = 0.6
}

# Clock, in the shell's monospace face.
label {
    monitor =
    text = $TIME
    font_size = 72
    font_family = Monaco
    color = rgba(230, 228, 225, 1.0)
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    font_size = 18
    font_family = Monaco
    color = rgba(230, 228, 225, 0.75)
    position = 0, 90
    halign = center
    valign = center
}

# Password field: square, chiselled, red when it is checking.
input-field {
    monitor =
    size = 320, 44
    outline_thickness = 1
    rounding = 0

    outer_color = rgba(20, 20, 20, 1.0)
    inner_color = rgba(35, 35, 35, 0.95)
    font_color = rgba(230, 228, 225, 1.0)
    font_family = Monaco

    check_color = rgba(224, 48, 60, 1.0)
    fail_color = rgba(255, 112, 67, 1.0)

    fade_on_empty = false
    placeholder_text = <i>password</i>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>

    position = 0, 0
    halign = center
    valign = center
}
