# Lock screen, in the same dark red as the rest of the rice.
# Still hyprlang: only Hyprland itself moved to Lua.

general {
    hide_cursor = true
    grace = 2
    no_fade_in = false
}

background {
    monitor =
    # Blur whatever is currently on screen rather than loading a separate
    # image -- one less thing to keep in sync with the wallpaper switcher.
    path = screenshot
    blur_passes = 3
    blur_size = 6
    brightness = 0.4
    contrast = 1.1
}

# Clock.
label {
    monitor =
    text = $TIME
    font_size = 72
    font_family = Monaco
    color = rgba(e6e4e1ff)
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    font_size = 18
    font_family = Monaco
    color = rgba(e6e4e1bf)
    position = 0, 90
    halign = center
    valign = center
}

# Battery and charge state, because the most common reason to look at a
# locked ThinkPad is to find out whether it is still alive.
label {
    monitor =
    text = cmd[update:30000] cat /sys/class/power_supply/BAT0/capacity 2>/dev/null | sed 's/$/%/'
    font_size = 14
    font_family = Monaco
    color = rgba(e0303ccc)
    position = 0, -90
    halign = center
    valign = center
}

# Password field: square, chiselled, red while it checks.
input-field {
    monitor =
    size = 320, 44
    outline_thickness = 1
    rounding = 0

    outer_color = rgba(080808ff)
    inner_color = rgba(232323f2)
    font_color = rgba(e6e4e1ff)
    font_family = Monaco

    check_color = rgba(e0303cff)
    fail_color = rgba(ff7043ff)

    fade_on_empty = false
    placeholder_text = <i>password</i>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>

    position = 0, 0
    halign = center
    valign = center
}
