# Default programs and the shell's IPC entry points.
#
# Sourced near the top of hyprland.conf, before any keybind that uses these
# variables -- Hyprland substitutes variables as it parses each line, so a
# definition that comes after a bind has no effect on it.
#
# The Home Manager module replaces this file wholesale from
# `programs.thinkpadism.terminal` and `programs.thinkpadism.tools.*`. Edit it
# directly if you installed with install.sh.

# The shell. Started here rather than in hyprland.conf so the Home Manager
# module, which regenerates this file, can launch it by store path.
exec-once = quickshell

$terminal    = kitty
$fileManager = nemo
$browser     = firefox

# Terminal tools. Keep these in sync with execCommands in
# ~/.config/thinkpadism/settings.json, which is what the shell's own buttons
# use.
$tuiFiles       = $terminal -e yazi
$tuiNetwork     = $terminal -e nmtui
$tuiAudio       = $terminal -e wiremix
$tuiPerformance = $terminal -e btop

# The launcher and appearance menu are Quickshell popups reached over its IPC
# socket. The handler is registered per-monitor, so the target has to name the
# focused one -- hence the shell substitution, which runs because `exec` hands
# the whole string to /bin/sh.
$focusedMonitor = $(hyprctl monitors -j | jq -r '.[] | select(.focused == true) | .name')
$menu           = quickshell ipc call appLauncher_$focusedMonitor toggleAppLauncher
$appearanceMenu = quickshell ipc call appLauncher_$focusedMonitor toggleThemeMenu
$toggleDarkMode = quickshell ipc call appLauncher_$focusedMonitor toggleDarkMode
