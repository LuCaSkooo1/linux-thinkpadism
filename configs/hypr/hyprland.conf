# ===========================================================================
#   Linux Thinkpadism — Hyprland configuration
#
#   Tuned for a ThinkPad: sane defaults for the trackpoint and touchpad, a
#   lid switch that does the right thing, ten fixed workspaces to match the
#   taskbar, and red window borders to match the shell.
#
#   Machine-specific bits (monitors, keyboard layout) are kept in one block
#   at the top so this file rarely needs editing past first run.
# ===========================================================================


#                                  !! MONITORS !!                            #
# -------------------------------------------------------------------------- #

# Auto-detect everything. `,preferred,auto,1` means: any output, its preferred
# mode, positioned automatically, at scale 1.
#
# Run `hyprctl monitors all` and replace this with explicit lines if you want
# a fixed arrangement. A HiDPI ThinkPad panel usually wants scale 1.5 or 2:
#   monitor = eDP-1, preferred, auto, 1.5
monitor = , preferred, auto, 1

# Internal panel. Referenced by the lid-switch rules further down.
$laptopMonitor = eDP-1


#                                 !! AUTOSTART !!                            #
# -------------------------------------------------------------------------- #

# Polkit agent, so graphical apps can ask for a password.
exec-once = systemctl --user start hyprpolkitagent

# Wallpaper daemon. The shell drives it over hyprctl; it just needs to run.
exec-once = hyprpaper

# The shell itself (taskbar, launcher, menus).
exec-once = quickshell

# Notifications.
exec-once = mako

# Idle management: dim, lock, blank, suspend. See hypridle.conf.
exec-once = hypridle

# Network and bluetooth applets land in the shell's system tray.
exec-once = nm-applet --indicator
exec-once = blueman-applet

# Cursor theme. Also exported below so Qt/GTK apps agree.
exec-once = hyprctl setcursor Hackneyed-24px 24


#                              !! DEFAULT PROGRAMS !!                         #
# -------------------------------------------------------------------------- #

# Terminal, file manager, browser and the TUI tools live in their own file so
# they can be swapped without touching this one -- and because Hyprland
# expands variables as it parses, they must be defined before the keybinds
# below that use them.
source = ~/.config/hypr/programs.conf


#                            !! ENVIRONMENT VARIABLES !!                      #
# -------------------------------------------------------------------------- #

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# Qt apps: use the Wayland backend and stop Qt from drawing its own
# title bars over Hyprland's decorations.
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1

# Firefox and friends in native Wayland.
env = MOZ_ENABLE_WAYLAND,1

# Tell toolkits and XDG portals which desktop this is.
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland


#                                   !! INPUT !!                               #
# -------------------------------------------------------------------------- #

input {
    # Switch layout by pressing alt + shift.
    kb_layout  = us,se
    kb_options = grp:alt_shift_toggle

    kb_rules   =
    kb_variant =
    kb_model   =

    follow_mouse = 1

    # -1.0 to 1.0; 0 means the driver's own acceleration.
    sensitivity = 0

    # Let the keyboard repeat quickly, which matters in a TUI-heavy setup.
    repeat_rate  = 40
    repeat_delay = 300

    touchpad {
        # ThinkPad touchpads are small; tapping beats pressing.
        tap-to-click     = true
        natural_scroll   = true
        disable_while_typing = true
        drag_lock        = true
        scroll_factor    = 0.6

        # Two-finger scrolling rather than edge scrolling.
        clickfinger_behavior = true
    }
}

# Trackpoint: a touch slower than the touchpad.
#
# The device name differs between models -- run `hyprctl devices` and copy the
# one that looks like a pointing stick if this block does nothing for you.
device {
    name = tpps/2-elan-trackpoint
    sensitivity = -0.2
}

gestures {
    # Three-finger horizontal swipe moves between workspaces.
    workspace_swipe = true
    workspace_swipe_fingers = 3
    workspace_swipe_distance = 300
    workspace_swipe_cancel_ratio = 0.3
}

# Don't render a hardware cursor plane; fixes flicker on Intel and NVIDIA.
cursor {
    no_hardware_cursors = true
}


#                                  !! DESIGN !!                               #
# -------------------------------------------------------------------------- #

# Animations stay off: the whole point of the rice is an instant, mechanical
# desktop, and it saves a little battery.
animations {
    enabled = false
}

general {
    # Inner and outer gaps between windows.
    gaps_in  = 5
    gaps_out = 10

    # A thin border, coloured to match the shell's red accent.
    border_size = 1

    # Red for the focused window, grey for everything else.
    col.active_border   = rgb(b3121d)
    col.inactive_border = rgb(9a9691)

    # Resize windows by dragging their borders and the gaps between them.
    resize_on_border = true

    layout = dwindle

    # READ https://wiki.hyprland.org/Configuring/Tearing/ BEFORE TURNING ON!
    allow_tearing = false
}

decoration {
    # Square corners, in keeping with the 90s look.
    rounding = 0

    # Opacity stays flat; the coloured border does the work.
    active_opacity   = 1.0
    inactive_opacity = 1.0

    shadow:enabled       = true
    shadow:range         = 2
    shadow:render_power  = 5
    shadow:sharp         = false
    shadow:color         = rgba(0,0,0,0.85)
    shadow:ignore_window = true
    shadow:offset        = 2 2
    shadow:scale         = 1

    blur:enabled = false
}

# Read https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more info.
dwindle {
    pseudotile      = true
    preserve_split  = true
}

# Read https://wiki.hyprland.org/Configuring/Master-Layout/ for more info.
master {
    new_status = master
}

misc {
    # We ship our own wallpapers.
    force_default_wallpaper = 0
    disable_hyprland_logo   = true

    # Don't wake the GPU to redraw a fullscreen video's surroundings.
    vfr = true
    # Drop to a lower refresh rate when nothing is moving. Worth real battery
    # life on a high-refresh panel.
    vrr = 1
}


#                                !! WORKSPACES !!                             #
# -------------------------------------------------------------------------- #

# Ten persistent workspaces, so the taskbar's fixed 1..10 strip always has
# something to point at. They live on whichever monitor is focused first.
workspace = 1,  persistent:true
workspace = 2,  persistent:true
workspace = 3,  persistent:true
workspace = 4,  persistent:true
workspace = 5,  persistent:true
workspace = 6,  persistent:true
workspace = 7,  persistent:true
workspace = 8,  persistent:true
workspace = 9,  persistent:true
workspace = 10, persistent:true


#                                 !! KEYBINDS !!                              #
# -------------------------------------------------------------------------- #

# Super is the main modifier.
$mainMod = SUPER

# --- Launching ---
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, E,      exec, $fileManager
bind = $mainMod, B,      exec, $browser
bind = $mainMod, D,      exec, $menu

# --- Terminal tools ---
bind = $mainMod SHIFT, E, exec, $tuiFiles
bind = $mainMod SHIFT, N, exec, $tuiNetwork
bind = $mainMod SHIFT, A, exec, $tuiAudio
bind = $mainMod SHIFT, P, exec, $tuiPerformance

# --- Appearance ---
# Super+T opens the theme/wallpaper picker, Super+Shift+T flips dark/light.
bind = $mainMod,       T, exec, $appearanceMenu
bind = $mainMod SHIFT, T, exec, $toggleDarkMode

# --- Window management ---
bind = $mainMod,       Q,     killactive,
bind = $mainMod,       F,     fullscreen
bind = $mainMod SHIFT, SPACE, togglefloating
bind = $mainMod,       P,     pseudo
bind = $mainMod,       J,     togglesplit
bind = $mainMod SHIFT, Q,     exit,

# Move focus with the arrow keys and with vim keys.
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d
bind = $mainMod, H,     movefocus, l
bind = $mainMod, L,     movefocus, r
bind = $mainMod, K,     movefocus, u

# Move the focused window around.
bind = $mainMod SHIFT, left,  movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up,    movewindow, u
bind = $mainMod SHIFT, down,  movewindow, d

# Resize the focused window.
binde = $mainMod CTRL, left,  resizeactive, -40 0
binde = $mainMod CTRL, right, resizeactive,  40 0
binde = $mainMod CTRL, up,    resizeactive,  0 -40
binde = $mainMod CTRL, down,  resizeactive,  0  40

# --- Screenshots ---
# Region to clipboard and to /tmp.
bind = $mainMod SHIFT, S, exec, hyprshot --mode region --output-folder /tmp
bind = , Print,           exec, hyprshot --mode output --output-folder /tmp

# --- Lock ---
bind = $mainMod, Escape, exec, hyprlock

# --- Workspaces ---
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move a focused window to a workspace with mainMod + SHIFT + [0-9].
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Cycle workspaces with the scroll wheel while holding Super.
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up,   workspace, e-1

# Move and resize windows by dragging with Super held.
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow


#                            !! LAPTOP HARDWARE KEYS !!                       #
# -------------------------------------------------------------------------- #

# Volume and mic. `bindel` keeps working while the key is held and while the
# screen is locked.
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute,     exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Backlight.
bindel = , XF86MonBrightnessUp,   exec, brightnessctl s 10%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl s 10%-

# Keyboard backlight, the ThinkPad two-level one.
bindel = , XF86KbdBrightnessUp,   exec, brightnessctl -d tpacpi::kbd_backlight s +1
bindel = , XF86KbdBrightnessDown, exec, brightnessctl -d tpacpi::kbd_backlight s 1-

# Media keys.
bindl = , XF86AudioPlay,  exec, playerctl play-pause
bindl = , XF86AudioNext,  exec, playerctl next
bindl = , XF86AudioPrev,  exec, playerctl previous

# The ThinkPad F-row extras.
bindl = , XF86Favorites,   exec, $menu
bindl = , XF86Search,      exec, $menu
bindl = , XF86Display,     exec, $terminal -e wdisplays
bindl = , XF86WLAN,        exec, $tuiNetwork


#                              !! LID & POWER !!                              #
# -------------------------------------------------------------------------- #

# Closing the lid: if an external monitor is attached, just turn the internal
# panel off and carry on. Otherwise lock, and let hypridle/logind suspend.
bindl = , switch:on:Lid Switch,  exec, hyprctl keyword monitor "$laptopMonitor, disable"
bindl = , switch:off:Lid Switch, exec, hyprctl keyword monitor "$laptopMonitor, preferred, auto, 1"

# The power button asks rather than acting, so a stray press is recoverable.
bindl = , XF86PowerOff, exec, hyprlock


#                                !! WINDOW RULES !!                           #
# -------------------------------------------------------------------------- #

# Float the small utility windows that have no business being tiled.
windowrule = float, class:^(nm-connection-editor|blueman-manager)$
windowrule = float, class:^(pavucontrol|org.pulseaudio.pavucontrol)$
windowrule = float, class:^(nwg-look)$
windowrule = float, title:^(Picture-in-Picture)$
windowrule = pin,   title:^(Picture-in-Picture)$

# File chooser and other transient dialogs.
windowrule = float, class:^(xdg-desktop-portal-gtk)$

# Don't let idle management blank the screen during a fullscreen video.
windowrule = idleinhibit fullscreen, class:.*

# Kitty and other terminals should never get a shadow; it reads as a smear
# against the flat background.
windowrule = noshadow, class:^(kitty)$
