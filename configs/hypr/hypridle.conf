# Idle management. Still hyprlang: only Hyprland itself moved to Lua.
#
# The ladder is: dim, lock, blank, suspend. Each step is undone on
# activity. A T420 on a nine-year-old battery benefits from the last step
# being fairly aggressive.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# Dim the backlight after 2.5 minutes, restore it on activity.
# -s saves the current level so -r can put it back exactly.
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# Kill the keyboard backlight with it.
listener {
    timeout = 150
    on-timeout = brightnessctl -sd tpacpi::kbd_backlight set 0
    on-resume = brightnessctl -rd tpacpi::kbd_backlight
}

# Lock after 5 minutes.
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Blank the panel a minute after locking. The CCFL/LED backlight is the
# single biggest draw on this machine.
listener {
    timeout = 360
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Suspend after 20 minutes.
listener {
    timeout = 1200
    on-timeout = systemctl suspend
}
