# Idle management.
#
# The ladder is: dim the backlight, lock, blank the panel, suspend. Each step
# is undone on activity. Times are deliberately generous on AC and cut short
# by logind's own suspend settings on battery.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# Dim the backlight after 2.5 minutes, restore it on activity.
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# Turn the keyboard backlight off with it.
listener {
    timeout = 150
    on-timeout = brightnessctl -sd tpacpi::kbd_backlight set 0
    on-resume = brightnessctl -rd tpacpi::kbd_backlight
}

# Lock after 5 minutes.
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Blank the panel after 6 minutes.
listener {
    timeout = 360
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Suspend after 30 minutes.
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
