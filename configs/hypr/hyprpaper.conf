# Wallpaper daemon.
#
# The shell's Appearance menu drives this over `hyprctl hyprpaper reload`, so
# anything set here is only the wallpaper you start the session with. Point it
# at whichever image you like; the empty monitor field means "all outputs".
#
# The install script copies this repo's wallpapers to ~/Pictures/Wallpapers,
# which is also the directory the Appearance menu scans by default.


wallpaper {
  monitor =
  path = ~/Pictures/Wallpapers/peak_into_the_system.png
  fit_mode = cover
}

# Keep the decoded image in RAM so switching back to it is instant. Turn this
# off if you are short on memory.
splash = false
ipc = on
