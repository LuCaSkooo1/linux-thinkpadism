# Wallpaper daemon. Still hyprlang: only Hyprland itself moved to Lua.
#
# The shell's Appearance menu drives this over `hyprctl hyprpaper`, so what
# is set here is only the wallpaper the session starts with.

wallpaper {
  monitor =
  path = ~/Pictures/Wallpapers/peak_into_the_system.png
  fit_mode = cover
}

# No splash text over the wallpaper.
splash = false

# The Appearance menu needs this to switch wallpapers at runtime.
ipc = on
