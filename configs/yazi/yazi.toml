# Thinkpadism Yazi configuration.
#
# Tuned for a 1366x768 panel: a narrow parent column, a wide preview, and
# a line mode that actually tells you something.

[mgr]
# parent : current : preview. The default 1:4:3 wastes the preview pane on
# a small screen; 1:3:4 gives the preview the room it needs.
ratio = [1, 3, 4]

sort_by        = "alphabetical"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true

# Show size next to each entry. On a machine with a 128GB SSD, knowing
# what is big matters more than knowing when it was touched.
linemode = "size"

show_hidden  = false
show_symlink = true

# Keep five lines of context above and below the cursor.
scrolloff = 5

[preview]
wrap     = "no"
tab_size = 4

# The T420's Intel HD 3000 decodes images fine but the panel is small;
# capping the preview size keeps scrolling through a photo directory from
# stuttering.
max_width     = 800
max_height    = 600
image_delay   = 20
image_filter  = "triangle"
image_quality = 75

[opener]
edit = [
  { run = '${EDITOR:-nvim} "$@"', desc = "Edit", for = "unix", block = true },
]
play = [
  { run = 'mpv --force-window "$@"', desc = "Play", for = "unix", orphan = true },
  { run = '''mediainfo "$1"; echo "Press enter to exit"; read _''', desc = "Media info", for = "unix", block = true },
]
open = [
  { run = 'xdg-open "$1"', desc = "Open", for = "unix" },
]
reveal = [
  { run = 'xdg-open "$(dirname "$1")"', desc = "Reveal", for = "unix" },
  { run = '''exiftool "$1"; echo "Press enter to exit"; read _''', desc = "EXIF", for = "unix", block = true },
]
extract = [
  { run = 'ya pub extract --list "$@"', desc = "Extract here" },
]

[open]
rules = [
  { mime = "folder/*", use = ["edit", "open", "reveal"] },
  { mime = "text/*",   use = ["edit", "reveal"] },
  { mime = "image/*",  use = ["open", "reveal"] },
  { mime = "{audio,video}/*", use = ["play", "reveal"] },
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", use = ["extract", "reveal"] },
  { mime = "application/{json,ndjson}", use = ["edit", "reveal"] },
  { mime = "*/javascript", use = ["edit", "reveal"] },
  { mime = "inode/empty",  use = ["edit", "reveal"] },
  { mime = "*", use = ["open", "reveal"] },
]

[plugin]
prepend_previewers = [
  # Show the contents of an archive rather than "binary file".
  { mime = "application/*zip",        run = "ouch" },
  { mime = "application/x-tar",       run = "ouch" },
  { mime = "application/x-bzip2",     run = "ouch" },
  { mime = "application/x-7z-compressed", run = "ouch" },
  { mime = "application/x-rar",       run = "ouch" },
  { mime = "application/xz",          run = "ouch" },
]
