# Thinkpadism Yazi configuration.
#
# A narrow parent column, a wide preview, and file sizes in the listing.

[mgr]
# parent : current : preview.
ratio = [1, 3, 4]

sort_by        = "alphabetical"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true

# Show size next to each entry.
linemode = "size"

show_hidden  = false
show_symlink = true

# Keep five lines of context above and below the cursor.
scrolloff = 5

[preview]
wrap     = "no"
tab_size = 4

max_width     = 800
max_height    = 600
image_delay   = 20
image_filter  = "triangle"
image_quality = 75

[opener]
edit = [
  { run = '${EDITOR:-nvim} "$@"', desc = "Edit", for = "unix", block = true },
]
open = [
  { run = 'xdg-open "$1"', desc = "Open", for = "unix" },
]

[open]
rules = [
  { mime = "text/*",   use = ["edit", "open"] },
  { mime = "inode/empty", use = ["edit"] },
  { mime = "application/json", use = ["edit", "open"] },
  { mime = "*", use = ["open", "edit"] },
]
